name: Build & Release SimpleWoW Chat

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1. COMPILAR ESCRITORIO (Windows, Linux, macOS)
  # ------------------------------------------------------------------
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SimpleWoW-Chat-Windows.exe
            output_file: dist/SimpleWoW-Chat.exe
          - os: ubuntu-latest
            artifact_name: SimpleWoW-Chat-Linux
            output_file: dist/SimpleWoW-Chat
          - os: macos-latest
            artifact_name: SimpleWoW-Chat-macOS
            output_file: dist/SimpleWoW-Chat

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar librerías gráficas en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libmpv2

      - name: Instalar dependencias Python
        run: pip install flet keyring pyinstaller

      - name: Empaquetar aplicación
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "SimpleWoW-Chat" --collect-all flet --collect-all flet_desktop main.py

      - name: Renombrar ejecutable
        shell: bash
        run: mv "${{ matrix.output_file }}" "${{ matrix.artifact_name }}"

      - name: Subir artefacto de escritorio
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ------------------------------------------------------------------
  # 2. COMPILAR ANDROID (APK)
  # ------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar Flet
        run: pip install flet

      - name: Compilar APK Android
        run: python -m flet.cli build apk --yes

      - name: Renombrar APK
        run: mv build/apk/app-release.apk SimpleWoW-Chat-Android.apk

      - name: Subir artefacto Android
        uses: actions/upload-artifact@v4
        with:
          name: SimpleWoW-Chat-Android.apk
          path: SimpleWoW-Chat-Android.apk

  # ------------------------------------------------------------------
  # 3. CREAR RELEASE AUTOMÁTICA SI EL COMMIT DICE "version x.xx"
  # ------------------------------------------------------------------
  release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    # Solo se ejecuta si el mensaje del commit contiene "version X.XX" (insensible a mayúsculas)
    if: contains(github.event.head_commit.message, 'version ') || contains(github.event.head_commit.message, 'Version ')

    steps:
      - name: Extraer número de versión del commit
        id: get_version
        run: |
          MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$MSG" | grep -oiE 'version [0-9]+\.[0-9]+(\.[0-9]+)?' | awk '{print $2}' | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "No se encontró formato version x.xx"
            exit 1
          fi
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Descargar todos los binarios compilados
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "SimpleWoW Chat v${{ steps.get_version.outputs.version }}"
          body: |
            ## SimpleWoW Chat v${{ steps.get_version.outputs.version }}
            
            Cliente de chat multiplataforma para **Reinos de Leyenda (WoW 3.3.5a)**.
            
            ### Descargas disponibles:
            - **Windows**: `SimpleWoW-Chat-Windows.exe`
            - **Android**: `SimpleWoW-Chat-Android.apk`
            - **Linux**: `SimpleWoW-Chat-Linux`
            - **macOS**: `SimpleWoW-Chat-macOS`
          files: release-files/*
