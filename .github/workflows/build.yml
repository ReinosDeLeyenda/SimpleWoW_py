name: Build & Release SimpleWoW Chat

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1. DETECTAR Y ACTUALIZAR VERSIÓN SI EL COMMIT DICE "version x.xx"
  # ------------------------------------------------------------------
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      has_version: ${{ steps.ver.outputs.has_version }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer e incrementar versión
        id: ver
        run: |
          MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$MSG" | grep -oiE 'version [0-9]+\.[0-9]+(\.[0-9]+)?' | awk '{print $2}' | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "Commit sin etiqueta 'version x.xx'. Solo se compilarán artefactos."
            exit 0
          fi

          echo "has_version=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          # Actualizar __version__ en simplewow/__init__.py y version en pyproject.toml
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" simplewow/__init__.py
          if [ -f pyproject.toml ]; then
            sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          fi

          # Guardar el cambio de versión en el repositorio sin disparar otro build ([skip ci])
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add simplewow/__init__.py pyproject.toml
          git diff --cached --quiet || git commit -m "chore: bump version to $VERSION [skip ci]"
          git push

  # ------------------------------------------------------------------
  # 2. COMPILAR ESCRITORIO (Windows, Linux, macOS)
  # ------------------------------------------------------------------
  build-desktop:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SimpleWoW-Chat-Windows.exe
            is_mac: false
          - os: ubuntu-latest
            artifact_name: SimpleWoW-Chat-Linux
            is_mac: false
          - os: macos-latest
            artifact_name: SimpleWoW-Chat-macOS.zip
            is_mac: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout código actualizado
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar librerías gráficas en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libmpv2

      - name: Instalar dependencias Python
        run: pip install flet keyring pyinstaller

      - name: Empaquetar aplicación
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "SimpleWoW-Chat" --collect-all flet --collect-all flet_desktop main.py

      - name: Preparar archivo final (Windows/Linux)
        if: matrix.is_mac == false
        shell: bash
        run: |
          if [ -f "dist/SimpleWoW-Chat.exe" ]; then
            mv "dist/SimpleWoW-Chat.exe" "${{ matrix.artifact_name }}"
          else
            mv "dist/SimpleWoW-Chat" "${{ matrix.artifact_name }}"
          fi

      - name: Comprimir bundle .app (macOS)
        if: matrix.is_mac == true
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" "SimpleWoW-Chat.app"

      - name: Subir artefacto de escritorio
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ------------------------------------------------------------------
  # 3. COMPILAR ANDROID (APK)
  # ------------------------------------------------------------------
  build-android:
    needs: prepare-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código actualizado
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Aceptar licencias Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Flet
        run: pip install flet

      - name: Compilar APK Android (ARM64 + ARMv7)
        run: python -m flet.cli build apk --arch arm64-v8a --arch armeabi-v7a --yes

      - name: Renombrar APK
        run: mv build/apk/app-release.apk SimpleWoW-Chat-Android.apk

      - name: Subir artefacto Android
        uses: actions/upload-artifact@v4
        with:
          name: SimpleWoW-Chat-Android.apk
          path: SimpleWoW-Chat-Android.apk

  # ------------------------------------------------------------------
  # 4. PUBLICAR GITHUB RELEASE SI SE DETECTÓ "version x.xx"
  # ------------------------------------------------------------------
  release:
    needs: [prepare-version, build-desktop, build-android]
    if: needs.prepare-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todos los binarios compilados
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: "SimpleWoW Chat v${{ needs.prepare-version.outputs.version }}"
          body: |
            ## SimpleWoW Chat v${{ needs.prepare-version.outputs.version }}
            
            Cliente de chat multiplataforma para **Reinos de Leyenda (WoW 3.3.5a)**.
            
            ### Descargas disponibles:
            - **Windows**: `SimpleWoW-Chat-Windows.exe`
            - **Android**: `SimpleWoW-Chat-Android.apk`
            - **Linux**: `SimpleWoW-Chat-Linux`
            - **macOS**: `SimpleWoW-Chat-macOS.zip`
          files: release-files/*
