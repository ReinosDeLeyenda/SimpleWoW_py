name: Build & Release SimpleWoW Chat

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1. DETECTAR NUEVA VERSIÓN DIRECTAMENTE DEL CÓDIGO (SIN COMMIT FANTASMA)
  # ------------------------------------------------------------------
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar si la versión es nueva
        id: ver
        run: |
          # Extrae __version__ de simplewow/__init__.py
          VERSION=$(grep -oE '__version__\s*=\s*["'\''][0-9]+\.[0-9]+(\.[0-9]+)?["'\'']' simplewow/__init__.py | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)

          # Si no está en __init__.py, intenta leerla de pyproject.toml
          if [ -z "$VERSION" ] && [ -f pyproject.toml ]; then
            VERSION=$(grep -oE '^version\s*=\s*["'\''][0-9]+\.[0-9]+(\.[0-9]+)?["'\'']' pyproject.toml | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
          fi

          if [ -z "$VERSION" ]; then
            echo "No se encontró versión válida. Solo se compilarán artefactos."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Comprueba si el tag ya existe en GitHub
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe. Se compilarán artefactos sin crear Release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "¡Nueva versión $TAG detectada! Se publicará Release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # ------------------------------------------------------------------
  # 2. COMPILAR ESCRITORIO (Windows, Linux, macOS)
  # ------------------------------------------------------------------
  build-desktop:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SimpleWoW-Chat-Windows.exe
            is_mac: false
          - os: ubuntu-latest
            artifact_name: SimpleWoW-Chat-Linux
            is_mac: false
          - os: macos-latest
            artifact_name: SimpleWoW-Chat-macOS.zip
            is_mac: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar librerías gráficas en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libmpv2

      - name: Instalar dependencias Python
        run: pip install flet keyring pyinstaller

      - name: Empaquetar aplicación
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "SimpleWoW-Chat" --collect-all flet --collect-all flet_desktop main.py

      - name: Preparar archivo final (Windows/Linux)
        if: matrix.is_mac == false
        shell: bash
        run: |
          if [ -f "dist/SimpleWoW-Chat.exe" ]; then
            mv "dist/SimpleWoW-Chat.exe" "${{ matrix.artifact_name }}"
          else
            mv "dist/SimpleWoW-Chat" "${{ matrix.artifact_name }}"
          fi

      - name: Comprimir bundle .app (macOS)
        if: matrix.is_mac == true
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" "SimpleWoW-Chat.app"

      - name: Subir artefacto de escritorio
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ------------------------------------------------------------------
  # 3. COMPILAR Y FIRMAR ANDROID (APK)
  # ------------------------------------------------------------------
  build-android:
    needs: prepare-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Aceptar licencias Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Flet
        run: pip install flet

      - name: Compilar APK Android (ARM64 + ARMv7)
        run: python -m flet.cli build apk --arch arm64-v8a --arch armeabi-v7a --yes

      - name: Firmar APK con esquema v1+v2+v3
        run: |
          APK_PATH=$(find build -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No se encontró ningún archivo .apk en build/"
            exit 1
          fi

          # Usa el keystore de Secrets si existe, o genera uno automático
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            keytool -genkey -v \
              -keystore release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass simplewow123 -keypass simplewow123 \
              -dname "CN=SimpleWoW, OU=Dev, O=ReinosDeLeyenda, L=Madrid, S=Madrid, C=ES"
            KS_PASS="simplewow123"
            KEY_ALIAS="upload"
            KEY_PASS="simplewow123"
          fi

          # Localizar zipalign y apksigner en el Android SDK del runner
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 "$APK_PATH" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out SimpleWoW-Chat-Android.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify SimpleWoW-Chat-Android.apk

      - name: Subir artefacto Android
        uses: actions/upload-artifact@v4
        with:
          name: SimpleWoW-Chat-Android.apk
          path: SimpleWoW-Chat-Android.apk

  # ------------------------------------------------------------------
  # 4. PUBLICAR GITHUB RELEASE SI LA VERSIÓN ES NUEVA
  # ------------------------------------------------------------------
  release:
    needs: [prepare-version, build-desktop, build-android]
    if: needs.prepare-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todos los binarios compilados
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: "SimpleWoW Chat v${{ needs.prepare-version.outputs.version }}"
          body: |
            ## SimpleWoW Chat v${{ needs.prepare-version.outputs.version }}
            
            ${{ github.event.head_commit.message }}
            
            ### Descargas disponibles:
            - **Windows**: `SimpleWoW-Chat-Windows.exe`
            - **Android**: `SimpleWoW-Chat-Android.apk`
            - **Linux**: `SimpleWoW-Chat-Linux`
            - **macOS**: `SimpleWoW-Chat-macOS.zip`
          files: release-files/*
