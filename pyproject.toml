[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplewow"
version = "0.25"
description = "SimpleWoW Chat - Reinos de Leyenda"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.80.0",
]

[tool.flet]
org = "org.reinosdeleyenda"
product = "SimpleWoW Chat"
company = "Reinos de Leyenda"
copyright = "Copyright (C) 2026 Reinos de Leyenda"

[tool.flet.android]
package = "org.reinosdeleyenda.simplewow"
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE",
]
